<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Simulation</title>
    <style>
        body, body * {
            user-select: none;
            -webkit-user-select: none; /* For Safari */
            -ms-user-select: none;     /* For IE/Edge */
            outline: none;             /* Remove focus outline if any */
        }
        body { margin: 0; }
        canvas { display: block; }
        #elapsed-time {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 4px;
        }
        #play-speed {
            position: fixed;
            top: 40px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 4px;
        }
        #world-list {
            position: fixed;
            top: 80px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
            background: #000; /* solid black */
            padding: 12px 18px;
            border-radius: 8px;
            outline: 2px solid #444;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            min-width: 120px;
        }
        #world-list .world-button {
            margin: 10px 0;
            padding: 8px 12px;
            border-radius: 4px;
            background: #2c2f36;
            transition: background 0.2s, color 0.2s;
            cursor: pointer;
            display: block;
        }
        #world-list .world-button:hover {
            background: #444851;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div id="elapsed-time">Time: 0.00s</div>
    <div id="play-speed">Speed: 1x</div>

    <div style="position: fixed; bottom: 20px; left: 20px; color: #fff; background: rgba(0,0,0,0.7); padding: 14px 18px; border-radius: 8px; font-size: 15px; max-width: 350px; z-index: 100;">
        <b>Controls:</b><br>
        <ul style="margin: 8px 0 0 18px; padding: 0; list-style: disc;">
            <li><b>Left/Right Arrow</b>: Speed up / slow down playback</li>
            <li><b>Left Click &amp; Drag</b>: Spin camera</li>
            <li><b>Right Click &amp; Drag</b>: Pan camera</li>
            <li><b>Scroll Wheel</b>: Zoom in/out</li>
            <!-- <li><b>A / D</b>: Change locked-on targets</li> -->
            <!-- <li><b>Enter</b>: Toggle locked-on mode</li> -->
        </ul>
    </div>



    <div id="world-list"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
