<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Simulation</title>
    <style>
        body, body * {
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            outline: none;
        }
        body { margin: 0; background: #000; }
        canvas { display: block; }

        /* Playback Panel */
        #playback-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 100;
        }
        #elapsed-time, #play-speed {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        #world-list {
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #444;
            min-width: 120px;
            margin-top: 12px;
        }
        #world-list .world-button {
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 4px;
            background: #2c2f36;
            transition: all 0.2s;
            cursor: pointer;
        }
        #world-list .world-button:hover {
            background: #444851;
            color: #ffd700;
        }

        /* Controls Legend */
        #controls-legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 13px;
            max-width: 300px;
            z-index: 100;
        }
        #controls-legend ul {
            margin: 8px 0 0 18px;
            padding: 0;
            list-style: disc;
        }
    </style>
</head>
<body>
    <!-- Playback Panel -->
    <div id="playback-panel">
        <div id="elapsed-time">Time: 0.00s</div>
        <div id="play-speed">Speed: 1x</div>
        <div id="world-list"></div>
    </div>

    <!-- Controls Legend -->
    <div id="controls-legend">
        <b>Controls:</b>
        <ul>
            <li><b>Left/Right Arrow</b>: Change speed</li>
            <li><b>Left Click + Drag</b>: Rotate camera</li>
            <li><b>Right Click + Drag</b>: Pan camera</li>
            <li><b>Scroll</b>: Zoom</li>
            <li><b>R</b>: Reset</li>
        </ul>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
